name: Update NEPSE Floorsheet

on:
  schedule:
    # Runs every day at 4:15 PM Nepal time (UTC+5:45)
    - cron: "30 10 * * 1-5" # 4:15 PM NPT, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Data/
          git commit -m "Update floorsheet data" || echo "No changes"
          git push